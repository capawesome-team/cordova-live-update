name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

env:
  JAVA_VERSION: 21
  NODE_VERSION: 24
  # Dummy app ID so the required `APP_ID` plugin variable is satisfied during install.
  TEST_APP_ID: "00000000-0000-0000-0000-000000000000"
  XCODE_VERSION: "16.4"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  verify-android:
    name: Verify Android platform
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Build plugin
        run: npm run build
      - name: Install Cordova
        run: npm install -g cordova
      # Cordova plugins have no standalone Gradle project, so the native sources
      # are verified by installing the plugin into a throwaway app and building it.
      - name: Build Android app with plugin
        run: |
          cordova create "$RUNNER_TEMP/verify-app" com.example.verify VerifyApp
          cd "$RUNNER_TEMP/verify-app"
          cordova platform add android
          cordova plugin add "$GITHUB_WORKSPACE" --variable APP_ID="$TEST_APP_ID"
          cordova build android

  verify-ios:
    name: Verify iOS platform
    runs-on: macos-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Build plugin
        run: npm run build
      - name: Install Cordova
        run: npm install -g cordova
      # Cordova plugins have no standalone Xcode project, so the native sources
      # are verified by installing the plugin into a throwaway app and building it
      # for the simulator (avoids code signing).
      - name: Build iOS app with plugin
        run: |
          cordova create "$RUNNER_TEMP/verify-app" com.example.verify VerifyApp
          cd "$RUNNER_TEMP/verify-app"
          cordova platform add ios
          cordova plugin add "$GITHUB_WORKSPACE" --variable APP_ID="$TEST_APP_ID"
          cordova build ios --emulator
