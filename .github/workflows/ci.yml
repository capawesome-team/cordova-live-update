name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

env:
  JAVA_VERSION: 21
  NODE_VERSION: 24
  # Dummy app ID so the required `APP_ID` plugin variable is satisfied during install.
  TEST_APP_ID: "00000000-0000-0000-0000-000000000000"
  XCODE_VERSION: "26.6"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  verify-android:
    name: Verify Android platform
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Build plugin
        run: npm run build
      - name: Install Cordova
        run: npm install -g cordova
      # Cordova plugins have no standalone Gradle project, so the native sources
      # are verified by installing the plugin into a throwaway app and building it.
      - name: Build Android app with plugin
        run: |
          cordova create "$RUNNER_TEMP/verify-app" com.example.verify VerifyApp
          cd "$RUNNER_TEMP/verify-app"
          cordova platform add android
          cordova plugin add "$GITHUB_WORKSPACE" --variable APP_ID="$TEST_APP_ID"
          cordova build android

  verify-ios:
    name: Verify iOS platform
    runs-on: macos-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Build plugin
        run: npm run build
      - name: Install Cordova
        run: npm install -g cordova
      # Cordova plugins have no standalone Xcode project, so the native sources
      # are verified by installing the plugin into a throwaway app and building it
      # for the simulator (avoids code signing).
      - name: Build iOS app with plugin
        run: |
          cordova create "$RUNNER_TEMP/verify-app" com.example.verify VerifyApp
          cd "$RUNNER_TEMP/verify-app"
          cordova platform add ios
          cordova plugin add "$GITHUB_WORKSPACE" --variable APP_ID="$TEST_APP_ID"
          cordova build ios --emulator
